name: Build and publish

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - default.conf.template
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  VERSION: 1.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.VERSION }}
            ghcr.io/${{ github.repository }}:latest

      # Run the pushed image and prove the CORS behaviour end to end:
      # preflight from the allowed origin gets 204 + ACAO for that origin,
      # a foreign origin never gets an ACAO matching its own origin
      # (browsers only honour an ACAO value equal to the requesting
      # origin), /healthz answers 200.
      - name: Verify CORS proxy in built image
        run: |
          docker run -d --rm --name cors-proxy-test -p 18080:80 \
            -e ALLOWED_ORIGIN=https://office.zetz.my.id \
            "ghcr.io/${{ github.repository }}:${{ env.VERSION }}"
          sleep 3
          echo "--- healthz (must be 200) ---"
          curl -sf -o /dev/null http://127.0.0.1:18080/healthz && echo "OK: healthz 200"
          echo "--- preflight, allowed origin (must be 204 + ACAO for office.zetz.my.id) ---"
          RESP=$(curl -s -i -X OPTIONS http://127.0.0.1:18080/v1/models \
            -H 'Origin: https://office.zetz.my.id' \
            -H 'Access-Control-Request-Method: GET' \
            -H 'Access-Control-Request-Headers: authorization,content-type')
          echo "$RESP" | grep -qi 'HTTP/1.1 204' || { echo "FAIL: preflight not 204"; exit 1; }
          echo "$RESP" | grep -qi 'access-control-allow-origin: https://office.zetz.my.id' || { echo "FAIL: allowed origin missing ACAO"; exit 1; }
          echo "OK: preflight 204 + ACAO for allowed origin"
          echo "--- preflight, foreign origin (must NOT get ACAO for its own origin) ---"
          if curl -s -i -X OPTIONS http://127.0.0.1:18080/v1/models \
            -H 'Origin: https://evil.example' \
            -H 'Access-Control-Request-Method: GET' \
            | grep -qi 'access-control-allow-origin: https://evil.example'; then
            echo "FAIL: foreign origin got ACAO for its own origin"
            exit 1
          else
            echo "OK: foreign origin did not get a usable ACAO"
          fi
          docker stop cors-proxy-test
